<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Tailwind CSS Demo</title>
    <link rel="stylesheet" href="src/style.css">
</head>

<body>
    <h1 class="text-3xl font-bold underline text-center text-blue-500">
        Hello world!
    </h1>

<br/>
    <div class="static bg-gray-200 p-2">
        Static Box
    </div>

<br/>

<div class="relative bg-gray-200 p-4">
    <div class="absolute top-2 left-8 bg-red-300 p-2">
        Absolute Box
    </div>
</div>

<div class="fixed top-10 left-0 w-full bg-black text-white p-4">
    Fixed Header
</div>

    <div class="mt-4 mr-2 mb-6 ml-8 bg-green-200 p-2">
        Box
    </div>

    <div class="px-6 py-4 bg-yellow-200">
        Content
    </div>

    <button class="px-4 py-2 bg-blue-500 text-white rounded">
        Click Me
    </button>

    <div class="p-2 md:p-6 lg:p-10 bg-purple-200">
        Responsive Box
    </div>

    <div class="w-40 p-4 bg-gray-300">
        Box
    </div>


    <div class="flex items-stretch h-24 bg-gray-200 p-2">
        <div class="bg-red-300 p-2">Flex Item 1</div>
        <div class="bg-green-300 p-2">Flex Item 2</div>
        <div class="bg-blue-300 p-2">Flex Item 3</div>
    </div>

    <p class = "text-base text-gray-700">
        This is a paragraph with Tailwind CSS styling.

    </p>

    <h1 class="text-right  text-4xl text-[#31b4d5] font-bold">
        Main Heading
    </h1>

    <div class="container mx-auto px-4">
        Content
    </div>

    <div class="w-1/2 bg-blue-200 p-4">
        Half Width Box
    </div>

    <div class="grid grid-rows-2 bg-gray-200 p-4">
        <div class="bg-blue-200 p-2">
            Grid Item 1
        </div>
        <div class="bg-green-200 p-2">
            Grid Item 2
        </div>
    </div>

    <div class="grid grid-cols-3 gap-4 bg-gray-200 p-4">
        <div class="bg-blue-200 p-2">
            Grid Item 1
        </div>
        <div class="bg-green-200 p-2">
            Grid Item 2
        </div>
        <div class="bg-yellow-200 p-2">
            Grid Item 3
        </div>

    </div>


    <div class="grid grid-cols-4 gap-4 p-4">
        <div class="col-span-3 bg-blue-200 p-2">
            Col Span 3
        </div>
        <div class="col-span-1 bg-green-200 p-2">
            Col Span 1
        </div>

    </div>



</body>

</html>
